<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">EWOF Evaluation Domains</title>
  <desc id="desc">Six pillars representing Operational Impact, Service Reliability, Monitoring Capability, Operational Efficiency, Implementation Feasibility, and Long-Term Operational Sustainability.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbfd"/>
      <stop offset="1" stop-color="#e7f2f7"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe5ea"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f2742" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="820" rx="28" fill="url(#background)"/>
  <g filter="url(#shadow)">
    <path d="M70 218 600 42l530 176v48H70z" fill="url(#roof)" stroke="#91a2ad" stroke-width="4"/>
    <path d="M110 218 600 73l490 145" fill="none" stroke="#b6c2c9" stroke-width="5"/>
    <rect x="56" y="246" width="1088" height="56" rx="10" fill="#eef3f5" stroke="#9cadb6" stroke-width="3"/>

    <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
      <text x="600" y="145" fill="#0f2742" font-size="54" font-weight="700">EWOF</text>
      <text x="600" y="188" fill="#1688ae" font-size="28" font-weight="700" letter-spacing="5">EVALUATION DOMAINS</text>

      <g>
        <rect x="82" y="286" width="156" height="356" rx="18" fill="#178db8"/>
        <rect x="82" y="286" width="156" height="28" rx="14" fill="#30a9cf"/>
        <rect x="82" y="614" width="156" height="28" rx="14" fill="#08779f"/>
        <text x="160" y="438" fill="#fff" font-size="25" font-weight="700">
          <tspan x="160" dy="0">Operational</tspan><tspan x="160" dy="34">Impact</tspan>
        </text>
      </g>
      <g>
        <rect x="258" y="286" width="156" height="356" rx="18" fill="#e48a18"/>
        <rect x="258" y="286" width="156" height="28" rx="14" fill="#f4a32f"/>
        <rect x="258" y="614" width="156" height="28" rx="14" fill="#c8740d"/>
        <text x="336" y="438" fill="#fff" font-size="25" font-weight="700">
          <tspan x="336" dy="0">Service</tspan><tspan x="336" dy="34">Reliability</tspan>
        </text>
      </g>
      <g>
        <rect x="434" y="286" width="156" height="356" rx="18" fill="#67a924"/>
        <rect x="434" y="286" width="156" height="28" rx="14" fill="#82c13c"/>
        <rect x="434" y="614" width="156" height="28" rx="14" fill="#548d19"/>
        <text x="512" y="438" fill="#fff" font-size="24" font-weight="700">
          <tspan x="512" dy="0">Monitoring</tspan><tspan x="512" dy="34">Capability</tspan>
        </text>
      </g>
      <g>
        <rect x="610" y="286" width="156" height="356" rx="18" fill="#08726f"/>
        <rect x="610" y="286" width="156" height="28" rx="14" fill="#168e8a"/>
        <rect x="610" y="614" width="156" height="28" rx="14" fill="#055a58"/>
        <text x="688" y="438" fill="#fff" font-size="24" font-weight="700">
          <tspan x="688" dy="0">Operational</tspan><tspan x="688" dy="34">Efficiency</tspan>
        </text>
      </g>
      <g>
        <rect x="786" y="286" width="156" height="356" rx="18" fill="#667586"/>
        <rect x="786" y="286" width="156" height="28" rx="14" fill="#81909f"/>
        <rect x="786" y="614" width="156" height="28" rx="14" fill="#536170"/>
        <text x="864" y="421" fill="#fff" font-weight="700">
          <tspan x="864" dy="0" font-size="18">Implementation</tspan><tspan x="864" dy="34" font-size="23">Feasibility</tspan>
        </text>
      </g>
      <g>
        <rect x="962" y="286" width="156" height="356" rx="18" fill="#93236f"/>
        <rect x="962" y="286" width="156" height="28" rx="14" fill="#ad3c88"/>
        <rect x="962" y="614" width="156" height="28" rx="14" fill="#761957"/>
        <text x="1040" y="391" fill="#fff" font-size="21" font-weight="700">
          <tspan x="1040" dy="0">Long-Term</tspan><tspan x="1040" dy="31">Operational</tspan><tspan x="1040" dy="31">Sustainability</tspan>
        </text>
      </g>

      <rect x="52" y="648" width="1096" height="96" rx="14" fill="url(#roof)" stroke="#91a2ad" stroke-width="3"/>
      <text x="600" y="707" fill="#0f2742" font-size="34" font-weight="700" letter-spacing="1">EGM Water Operational Framework</text>
      <text x="600" y="780" fill="#536b7a" font-size="21">Six complementary perspectives for structured operational evaluation</text>
    </g>
  </g>
</svg>
